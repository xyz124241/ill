name: Build ItemLock + Resourcepack

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Plugin bauen
        run: mvn -B clean package

      - name: Resourcepack finden, zippen und SHA-1 berechnen
        shell: bash
        run: |
          set -euo pipefail

          PACK_META="$(find . -type f -name pack.mcmeta -not -path './.git/*' -print -quit)"
          if [ -z "$PACK_META" ]; then
            echo "::error::pack.mcmeta wurde nicht gefunden. Bitte den Ordner resourcepack samt pack.mcmeta ins Repository hochladen."
            exit 1
          fi

          PACK_DIR="$(dirname "$PACK_META")"
          echo "Resourcepack gefunden: $PACK_DIR"

          mkdir -p dist
          (cd "$PACK_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/ACI-Crystals-Sense-ResourcePack.zip" .)

          JAR_FILE="$(find target -maxdepth 1 -type f -name 'ItemLock-*.jar' -print -quit)"
          if [ -z "$JAR_FILE" ]; then
            echo "::error::ItemLock-JAR wurde nach dem Maven-Build nicht gefunden."
            exit 1
          fi
          cp "$JAR_FILE" dist/ItemLock.jar

          echo "PACK_SHA1=$(sha1sum dist/ACI-Crystals-Sense-ResourcePack.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            **Dateien**
            - `ItemLock.jar` -> in den `plugins`-Ordner des Servers
            - `ACI-Crystals-Sense-ResourcePack.zip` -> ACI-Kristalle + Sense-Textur

            **SHA-1 des Resourcepacks:** `${{ env.PACK_SHA1 }}`
          files: |
            dist/ItemLock.jar
            dist/ACI-Crystals-Sense-ResourcePack.zip
